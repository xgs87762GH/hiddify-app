name: CI
on:
  # Fork note: upstream keeps this trigger disabled because every push to their
  # branches already runs CI. On a fork the feature branches are where the work
  # happens, so a pull request into this repo runs the same checks. The branch
  # list below stays untouched on purpose.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'
  push:
    branches:
       - main
       - dev
       - android-fix-action-bug
       - new-design-v2 
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions: write-all
    if: "${{!contains(github.event.head_commit.message, 'release: version')}}"
    with:
      upload-artifact: ${{ github.event_name == 'push' }}
      
