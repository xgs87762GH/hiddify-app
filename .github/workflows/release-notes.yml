name: Release notes

# The main release pipeline (release.yml -> build.yml) needs Apple/Android/Windows signing
# secrets. Without them it fails before it can create a release, so a fork would get a tag
# with no release at all. This workflow only publishes the release entry and its notes; the
# build pipeline adds the installers to the same release when it can.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.*'

permissions:
  contents: write

jobs:
  release-entry:
    name: Publish release entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          notes=".github/release_notes/${TAG}.md"
          # Title must equal the tag. A "Hiddify $TAG" title plus a body H1 of
          # "# $TAG" makes GitHub's Releases "On this page" list show both.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists — normalize title"
            gh release edit "$TAG" --title "$TAG"
            if [ -f "$notes" ]; then
              gh release edit "$TAG" --notes-file "$notes"
            fi
          elif [ -f "$notes" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
