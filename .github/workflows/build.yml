name: Build
on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_gz: "Hiddify-Linux-x64-AppImage.tar"
  TARGET_NAME_AppImage: "Hiddify-Linux-x64-AppImage"
  TARGET_NAME_deb: "Hiddify-Debian-x64"
  # TARGET_NAME_rpm: "Hiddify-rpm-x64"
  TARGET_NAME_apk: "Hiddify-Android"
  TARGET_NAME_aab: "Hiddify-Android"
  TARGET_NAME_exe: "Hiddify-Windows-Setup-x64"
  TARGET_NAME_msix: "Hiddify-Windows-x64"
  TARGET_NAME_zip: "Hiddify-Windows-Portable-x64"
  TARGET_NAME_dmg: "Hiddify-MacOS"
  TARGET_NAME_pkg: "Hiddify-MacOS-Installer"
  TARGET_NAME_ipa: "Hiddify-iOS"
  

jobs:
  test:
    outputs:
      draftBuildCode: ${{ steps.draftBuildCode.outputs.datetime }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          
      - name: Prepare
        run: make linux-amd64-prepare 2>&1 | tee prepare_log.txt
      - name: Test
        id: test
        continue-on-error: true
        run: flutter test 2>&1 | tee test_log.txt
      - name: Upload the build logs to the release
        # Logs are not readable without a token, so attach them where they can be read:
        # this is the only way to find out what actually broke on the runner.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf logs.tar.gz prepare_log.txt test_log.txt
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 &&
            gh release upload "$GITHUB_REF_NAME" logs.tar.gz --clobber ||
            echo "no release to attach the logs to yet"

      - name: make draftBuildCode
        id: draftBuildCode
        run: echo "::set-output name=datetime::$(date +'%d.%H.%M')"
      - name: Fail if the tests failed
        if: steps.test.outcome == 'failure'
        run: exit 1


  # Which publishing targets this fork actually has credentials for. Job level `if` cannot
  # read `env`, so the answers are computed here and consumed by `needs.*.outputs` below.
  check-secrets:
    runs-on: ubuntu-latest
    outputs:
      apple_upload: ${{ steps.check.outputs.apple_upload }}
      google_play: ${{ steps.check.outputs.google_play }}
    steps:
      - id: check
        env:
          APPLE_UPLOAD_CERT: ${{ secrets.APPLE_UPLOAD_CERTIFICATE_P12 }}
          GOOGLE_PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$APPLE_UPLOAD_CERT" ] && echo "apple_upload=true" >> $GITHUB_OUTPUT || echo "apple_upload=false" >> $GITHUB_OUTPUT
          [ -n "$GOOGLE_PLAY_JSON" ] && echo "google_play=true" >> $GITHUB_OUTPUT || echo "google_play=false" >> $GITHUB_OUTPUT

  build:
    needs: test
    permissions: write-all
    continue-on-error: true
    # A fork has no signing secrets. Everything that cannot work without them is skipped
    # instead of failing, so a release still ships what this fork can actually build.
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_APPLE_PROFILE: ${{ secrets.APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64 != '' }}
      HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_SIGNING_KEY != '' }}
      HAS_SENTRY_AUTH: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
    # macOS needs a real certificate; it fails loudly without one, which is fine because
    # this job keeps the rest of the pipeline going.

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android-apk
            os: ubuntu-latest
            targets: apk

          # - platform: android-aab
          #   os: ubuntu-latest
          #   targets: aab

          - platform: windows
            os: windows-latest
            aarch: amd64
            targets: exe,msix,zip

          - platform: linux
            os: ubuntu-22.04
            aarch: amd64
            targets: deb,gz,AppImage

          # - platform: linux-amd64
          #   os: ubuntu-22.04
          #   aarch: amd64
          #   targets: deb,gz

          # - platform: linux-arm64
          #   os: ubuntu-24.04-arm
          #   aarch: arm64
          #   targets: deb,gz

          # - platform: linux-amd64-musl
          #   os: ubuntu-22.04
          #   aarch: amd64
          #   targets: deb,gz

          # - platform: linux-arm64-musl
          #   os: ubuntu-24.04-arm
          #   aarch: arm64
          #   targets: deb,gz
            
          - platform: macos
            os: macos-15
            aarch: universal
            targets: dmg,pkg
            
          # - platform: ios
          #   os: macos-15
          #   aarch: universal
          #   filename: hiddify-ios
          #   targets: ipa
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Import Apple Codesign Certificates
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') && env.HAS_APPLE_CERT == 'true' }}
        uses: apple-actions/import-codesign-certs@v6
        with: 
            p12-file-base64: "${{ secrets.APPLE_CERTIFICATE_P12 }}"
            p12-password: "${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}"

      - name: Import Apple Mobile Provisioning Profile
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') && env.HAS_APPLE_PROFILE == 'true' }}
        run: |
           mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
           echo "${{secrets.APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
           ls ~/Library/MobileDevice/Provisioning\ Profiles
           security unlock-keychain -p "" signing_temp.keychain
           security find-identity -v -p codesigning
        #   ls ~/Library/MobileDevice/Provisioning\ Profiles
        #   echo "${{secrets.NEW_APPLE_MOBILE_PROVISIONING_PROFILES_TARXZ_BASE64}}"|base64 --decode | tar xJ -C ~/Library/MobileDevice/Provisioning\ Profiles
        #   # echo "${{secrets.NEW_APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64_2}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
          


      # - name: Setup Flutter for arm64
      #   if: ${{ startsWith(matrix.platform,'linux-arm64') }}
      #   uses: hurelhuyag/flutter-arm64-action@HEAD
      #   with:
      #     channel: 'stable'
      #     flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      - name: Clean up disk space
        if: startsWith(matrix.platform,'android')
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          df -h
          sudo rm -rf /opt/ghc
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
          rm -rf ~/.gradle/caches
          df -h
          sudo apt-get autoremove -y
          df -h
          sudo apt-get clean 
          df -h
          tree
      
      - name: Setup Java
        if: startsWith(matrix.platform,'android')
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      # - name: Setup NDK
      #   if: startsWith(matrix.platform,'android')
      #   uses: nttld/setup-ndk@v1
      #   id: setup-ndk
      #   with:
      #     ndk-version: ${{ env.NDK_VERSION }}
      #     add-to-path: true
      #     link-to-sdk: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        if: startsWith(matrix.platform,'android')
        with:
          # default also installs the legacy 'tools' package, which no longer exists
          packages: platform-tools
      # - name: Cache Android SDK
      #   uses: actions/cache@v5
      #   if: startsWith(matrix.platform,'android')
      #   with:
      #     path: |
      #       /usr/local/lib/android/sdk
      #     key: android-sdk-${{ runner.os }}-${{ env.NDK_VERSION }}
      #     restore-keys: |
      #       android-sdk-${{ runner.os }}-      
      - name: Cache Gradle
        uses: actions/cache@v5
        if: startsWith(matrix.platform,'android')

        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
                  
      - name: Setup dependencies
        run: |
          make ${{ matrix.platform }}-install-deps  
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup Android Signing Properties
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'android') }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/key.jks
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> android/key.properties

      - name: Setup Windows Signing Properties
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') && env.HAS_WINDOWS_CERT == 'true' }}
        run: |
            [IO.File]::WriteAllBytes("windows\sign.pfx", [Convert]::FromBase64String("${{ secrets.WINDOWS_SIGNING_KEY }}"))
            (Get-Content "windows\packaging\msix\make_config.yaml") -replace '^certificate_password:.*$', 'certificate_password: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}' | Set-Content "windows\packaging\msix\make_config.yaml"
            # Fail early with a readable reason instead of SignTool's "No certificates were found"
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2("windows\sign.pfx", "${{ secrets.WINDOWS_SIGNING_PASSWORD }}")
            Write-Host "Signing cert: $($cert.Subject) thumbprint=$($cert.Thumbprint) valid $($cert.NotBefore) -> $($cert.NotAfter)"
            if (-not $cert.HasPrivateKey) { throw "WINDOWS_SIGNING_KEY has no private key" }
            if ($cert.NotAfter -lt (Get-Date)) { throw "Windows signing certificate expired on $($cert.NotAfter); update WINDOWS_SIGNING_KEY / WINDOWS_SIGNING_PASSWORD / WINDOWS_SIGNING_SHA1" }
            if ("${{ secrets.WINDOWS_SIGNING_SHA1 }}" -and $cert.Thumbprint -ne "${{ secrets.WINDOWS_SIGNING_SHA1 }}".ToUpper()) { Write-Warning "WINDOWS_SIGNING_SHA1 does not match the certificate thumbprint" }

      - name: Create a test signing certificate (no secret configured)
        # Same setup this fork already uses locally: a self-signed "CN=Hiddify-Test" pfx with
        # the password make_config.yaml expects, so the msix can still be packaged.
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') && env.HAS_WINDOWS_CERT != 'true' }}
        run: |
            $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Hiddify-Test" `
              -KeyUsage DigitalSignature -FriendlyName "Hiddify Test" `
              -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(1)
            $pwd = ConvertTo-SecureString -String "1234" -Force -AsPlainText
            Export-PfxCertificate -Cert $cert -FilePath "windows\sign.pfx" -Password $pwd | Out-Null
            Write-Host "test certificate ready at windows\sign.pfx"

      # - name: Temporary disable Permission Handler for windows due to its issue in permission
      #   if: ${{ startsWith(matrix.platform,'windows') }}
      #   run: |
      #     (Get-Content -Path "pubspec.yaml") -notmatch "permission_handler" | Set-Content -Path "pubspec.yaml"
      #     (Get-Content -Path "lib\features\profile\add\add_profile_modal.dart") -notmatch "qr_code_scanner_screen" | Set-Content -Path "lib\features\profile\add\add_profile_modal.dart"
      #     (Get-Content -Path lib\features\profile\add\add_profile_modal.dart) -replace 'await QRCodeScannerScreen\(\).open\(context\);', 'null;' | Set-Content -Path lib\features\profile\add\add_profile_modal.dart
      #     Remove-Item -Path "lib\features\common\qr_code_scanner_screen.dart"




      - name: Prepare for ${{ matrix.platform }}
        run: |
          set -o pipefail
          make ${{ matrix.platform }}-prepare 2>&1 | tee prepare.log

      - name: Build ${{ matrix.platform }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -o pipefail
          make ${{ matrix.platform }}-release 2>&1 | tee build.log
      - name: Surface the build error
        # Logs cannot be read from outside the runner, but annotations can, so echo the
        # tail of the build as ::error:: lines: that is how a failure gets inspected here.
        if: failure()
        continue-on-error: true
        # Windows runners default to PowerShell, so ask for bash explicitly here.
        shell: bash
        run: |
          report=$( { echo "[build.log]"; tail -n 40 build.log 2>&1; echo "[prepare.log]"; tail -n 15 prepare.log 2>&1; } | tr '\n' '~' | tr -d '\r' | cut -c1-3000 )
          echo "::error::$report"

      - name: Publish the build logs to the release
        # CI logs need a token to read, so attach them to the release instead.
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf "logs-${{ matrix.os }}-${{ matrix.platform }}.tar.gz" prepare.log build.log || true
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 &&
            gh release upload "$GITHUB_REF_NAME" "logs-${{ matrix.os }}-${{ matrix.platform }}.tar.gz" --clobber ||
            echo "no release to attach the logs to yet"

      - name: Code Sign
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') && env.HAS_WINDOWS_CERT == 'true' }}
        # signtool-code-sign actions hardcode an SDK path (10.0.17763.0) missing on current runners,
        # so locate signtool from whichever Windows SDK is installed.
        env:
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          Write-Host "Using $($signtool.FullName)"
          $pfx = Resolve-Path "windows\sign.pfx"
          $exts = '.dll','.exe','.sys','.msix','.msixbundle','.appx','.appxbundle','.msi','.msp','.msm','.cab','.ps1','.psm1'
          $files = Get-ChildItem dist -Recurse -File | Where-Object { $exts -contains $_.Extension.ToLower() }
          foreach ($file in $files) {
            Write-Host "Signing $($file.FullName)"
            $ok = $false
            foreach ($attempt in 1..5) {
              & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /d Hiddify /f $pfx /p $env:SIGN_PASSWORD $file.FullName
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
              Start-Sleep -Seconds $attempt
            }
            if (-not $ok) { throw "failed to sign $($file.FullName)" }
          }

      - name: Copy to out Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
          New-Item -ItemType Directory -Path "out" -Force | Out-Null
          $targets = "${{ matrix.targets }}".Split(',')
          foreach ($ext in $targets) {
            $ext = $ext.Trim()
            $key = "TARGET_NAME_$ext"
            $targetName = (Get-Item "env:$key").Value
            
            $files = Get-ChildItem -Path dist -Recurse -Filter "*.$ext"
            
            foreach ($file in $files) {
                $destination = Join-Path -Path "out" -ChildPath "$targetName.$ext"
                Move-Item -Path $file.FullName -Destination $destination -Force
            }
          }
          Get-ChildItem -Path out
          
      - name: Upload Debug Symbols
        if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' && env.HAS_SENTRY_AUTH == 'true' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DIST: ${{ matrix.platform == 'android-aab' && 'google-play' || 'general' }}
        run: |
          dart pub global activate sentry_dart_plugin
          dart run sentry_dart_plugin 
      
      

              
      - name: Copy to out Android APK
        if: matrix.platform == 'android-apk'
        # fastforge writes into dist/<version>/, not into build/app/outputs, so look in both
        run: |
          mkdir -p out
          ls -R dist || echo "no dist"
          ls -R ./build/app/outputs || echo "no ./build/app/outputs"
          for apk in $(find dist ./build/app/outputs -name "*.apk" 2>/dev/null || true); do
            case "$apk" in
              *arm64*) suffix=arm64 ;;
              *armeabi-v7a*) suffix=arm7 ;;
              *x86_64*) suffix=x86_64 ;;
              *) suffix=universal ;;
            esac
            cp "$apk" "out/${TARGET_NAME_apk}-${suffix}.apk"
            echo "copied $apk -> out/${TARGET_NAME_apk}-${suffix}.apk"
          done

      - name: Copy to out Android AAB
        if: matrix.platform == 'android-aab'
        run: |
          mkdir -p out
          aab=$(ls dist/*/*.aab 2>/dev/null | head -n1)
          [ -n "$aab" ] && cp "$aab" out/hiddify-android-market.aab || echo "no aab"

      - name: Copy to out unix
        if: startsWith(matrix.platform,'linux') || matrix.platform == 'macos' || matrix.platform == 'ios'
        run: |
          ls -R dist/ || echo "nothing built into dist/"
          mkdir -p out tmp_out
          
          for EXT in $(echo ${{ matrix.targets }} | tr ',' '\n'); do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            echo "For $EXT ($KEY) filename is ${FILENAME}"
            # The fork's Makefile does not build every extension the matrix lists, so a
            # missing artifact skips its own turn instead of failing the whole step.
            mv dist/*/*.$EXT tmp_out/${FILENAME}.$EXT || { echo "no .$EXT produced for $EXT"; continue; }
            ls tmp_out
            [[ "$EXT" != "gz" ]] && chmod +x tmp_out/${FILENAME}.$EXT || echo "Skipping chmod for gz"
            if [ "${{matrix.platform}}" == "linux" ];then
              cp ./.github/help/linux/* tmp_out/
            else
              cp ./.github/help/mac-windows/* tmp_out/
            fi
            if [[ "${{matrix.platform}}" == 'ios' ]];then
              echo mv tmp_out/${FILENAME}.$EXT out/
              mv tmp_out/${FILENAME}.$EXT out/
            else
              cd tmp_out
              # 7z a ${FILENAME}.zip ./
              # mv ${FILENAME}.zip ../out/
              # [[ $EXT == 'AppImage' ]]&& mv ${FILENAME}.$EXT ../out/ # added for appimage link
              mv ${FILENAME}.$EXT ../out/
              cd ..
            fi
          done

      - name: Upload Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{matrix.platform}}
          path: ./out
          retention-days: 1

      - name: Surface what was built
        # Temporary diagnostic: annotations are readable without a token, logs are not.
        if: always()
        continue-on-error: true
        shell: bash
        # GitHub keeps only a couple of annotations per job, so everything goes into one.
        run: |
          report=$( { echo "[dist]"; ls -R dist 2>&1 | head -n 15; echo "[out]"; ls -R out 2>&1 | head -n 15; echo "[build.log]"; tail -n 25 build.log 2>&1; } | tr '\n' '~' | tr -d '\r' | cut -c1-3000 )
          echo "::error::$report"

      - name: Clean up keychain and provisioning profile
        if: ${{ always() && startsWith(matrix.os,'macos')}}
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db ||echo ok
          rm ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision ||echo ok

      - name: Publish the job logs to the release
        # Without a token the runner's own log cannot be read from the outside, so pull it
        # here and attach it to the release. Temporary aid while this pipeline is repaired.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          job=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs" \
                --jq ".jobs[] | select(.runner_name == \"$RUNNER_NAME\") | .id" | head -n1)
          echo "job id: $job"
          name="job_log-${{ matrix.platform }}.zip"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" -o "$name"
          ls -l "$name"
          if [ -s "$name" ] && gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$name" --clobber
          else
            echo "nothing to upload"
          fi
  update-draft:
    permissions: write-all
    if: ${{ inputs.upload-artifact }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          # by default, it uses a depth of 1
          # this fetches all history so that we can read each commit
          fetch-depth: 0
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/
          

      - name: Display Files Structure
        run: ls -R
        working-directory: ./out

      - name: Delete Current Release Assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: 'draft'
          deleteOnlyFromDrafts: false
          
      - name: prepare_release_message
        continue-on-error: true
        run: |
          set +e 
          sed 's|RELEASE_TAG|${{ env.TAG_NAME }}|g' ./.github/release_message.md > release.md
          pip install gitchangelog pystache mustache markdown
          prelease=$(curl --silent "https://api.github.com/repos/hiddify/hiddify-app/releases/latest" | grep -Po '"tag_name": "\K([^"]*)') 
          echo -e "\n\n<details markdown=1><summary>All changes from $current to the latest commit:</summary>\n\n">>release.md
          gitchangelog "${prelease}.." >> release.md  2>&1 || echo "Error in gitchangelog"
          echo -e "\n\n</details>">>release.md
      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/*
          name: 'draft'
          tag_name: 'draft'
          body_path: './release.md'
          prerelease: true

      - name: Create or Update Draft Release
        uses: softprops/action-gh-release@v3
        # env:
          #GITHUB_TOKEN: ${{ secrets.TOKEN_FOR_HIDDIFY_APP_REPO }}
          # GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

#          GITHUB_REPOSITORY: hiddify/hiddify-app
        with:
          files: ./out/*
          name: 'draft'
          tag_name: 'draft'
          body_path: './release.md'
          target_commitish: ${{ github.sha }}
          # target_commitish: '530bf77839a74d4f13847ba244a20734ac7ab119'
          prerelease: true
          # repository: hiddify/hiddify-app

  upload-release:
    permissions: write-all
    if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
    needs: [build, check-secrets]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/

      - name: Display Files Structure
        run: |
          ls -R ./out || echo "no out directory"
          mv out/hiddify-android-market.aab  hiddify-android-market.aab || echo "no aab in this release"
      - name: Surface what was collected
        if: failure()
        continue-on-error: true
        run: |
          report=$( ls -laR ./out 2>&1 | head -n 30 | tr '\n' '~' | tr -d '\r' | cut -c1-3000 )
          echo "::error::$report"

      - name: prepare_release_message
        run: |
          sed 's|RELEASE_TAG|${{ env.TAG_NAME }}|g' ./.github/release_message.md >> release.md

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # prerelease: ${{ env.CHANNEL == 'dev' }}
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          body_path: './release.md'
          files: ./out/*

      - name: Create service_account.json
        if: ${{ needs.check-secrets.outputs.google_play == 'true' }}
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Deploy to Google Play Internal Testers
        if: ${{ needs.check-secrets.outputs.google_play == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: app.hiddify.com
          releaseName: ${{ env.TAG_NAME }}
          releaseFiles: ./hiddify-android-market.aab
          track: 'beta'


  upload-to-testflight:
    needs: [build, check-secrets]
    if: ${{ inputs.upload-artifact &&  inputs.tag-name != 'draft' && needs.check-secrets.outputs.apple_upload == 'true' }}
    #if: ${{ inputs.upload-artifact }}
    runs-on: macOS-latest
    timeout-minutes: 30
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*ios*"
          path: ./out/

      - uses: Apple-Actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_UPLOAD_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}

      - uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: app.hiddify.com
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - uses: Apple-Actions/download-provisioning-profiles@v1
        with:
          bundle-id: app.hiddify.com.SingBoxPacketTunnel
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
  


      - name: Import Apple Mobile Provisioning Profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{secrets.APPLE_DIST_PROVISIONING_PROFILES_TARGZ_BASE64}}"|base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
        #echo "${{secrets.NEW_APPLE_STORE_PROVISIONING_PROFILES_TARXZ_BASE64}}"|base64 --decode | tar xJ -C ~/Library/MobileDevice/Provisioning\ Profiles

      - uses: Apple-Actions/upload-testflight-build@v4
        with:
          app-path: 'out/Hiddify-iOS.ipa' 
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
