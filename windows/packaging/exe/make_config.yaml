app_id: 6L903538-42B1-4596-G479-BJ779F21A65D
publisher: Hiddify
publisher_url: https://github.com/hiddify/hiddify-app
display_name: Hiddify
create_desktop_icon: true
install_dir_name: "{autopf64}\\Hiddify"
setup_icon_file: windows\runner\resources\app_icon.ico
locales:
  - ar
  - en
  # 'zhcn' is a deliberate non-standard code: the packager only maps known locale
  # codes to a language file under Inno Setup's install dir (and drops the ones it
  # cannot find), so 'zh' would be filtered out here. This repo ships its own
  # ChineseSimplified.isl and the script template below points at it.
  - zhcn
  - es
  - fr
  - pt
  - ru
  - tr
script_template: inno_setup.sas
