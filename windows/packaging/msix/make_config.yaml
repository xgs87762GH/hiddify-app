display_name: Hiddify
publisher_display_name: Hiddify
identity_name: Hiddify.HiddifyNext
msix_version: 5.0.8.0
logo_path: windows\runner\resources\app_icon.ico
capabilities: internetClient, internetClientServer, privateNetworkClientServer
languages: ar, en-us, es-es, fa-ir, fr-fr, id-id, pt-br, ru-ru, tr-tr, zh-cn, zh-tw
protocol_activation: hiddify, v2ray, v2rayn, v2rayng, clash, clashmeta, sing-box
execution_alias: hiddify
certificate_path: windows\sign.pfx
# Self-signed test certificate: there is no official windows\sign.pfx in the
# repo, so the package is signed with a locally generated "CN=Hiddify-Test"
# certificate instead. Windows treats it as an unknown publisher until that
# certificate is trusted on the machine.
certificate_password: "1234"
publisher: CN=Hiddify-Test
install_certificate: "false"
enable_at_startup: "true"
startup_task:
  parameters: --autostart

# The official package would use these instead:
# publisher: CN=8CB43675-F44B-4AA5-9372-E8727781BDC4
# certificate_password:

# The msix tool hardcodes the digicert timestamp server, which this network
# cannot reach, so the signing step fails unless these options replace it.
signtool_options: /f windows\sign.pfx /p 1234 /fd SHA256